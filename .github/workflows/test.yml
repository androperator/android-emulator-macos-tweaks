name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run release:pack -- "$RUNNER_TEMP/emulator-macos-tweaks-test.tgz"
